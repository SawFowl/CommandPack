plugins {
	id 'java'
	id 'eclipse'
	id 'com.diffplug.eclipse.apt' version '3.42.2'
	id 'net.minecraftforge.gradle' version '[7.0.13,8.0)'
}

minecraft {
	accessTransformer = true
}

repositories {
	minecraft.mavenizer(it)
	maven fg.forgeMaven
	maven fg.minecraftLibsMaven
}

dependencies {
	implementation minecraft.dependency('net.minecraftforge:forge:26.1-62.0.1')
	annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.1'
	implementation "org.spongepowered:spongeapi:${api}"
	implementation "org.spongepowered:mixin:${mixin}"
	implementation project(':core')
	implementation fileTree(dir: 'libs', include: '*.jar')
}

jar {
	archiveBaseName = 'part'
}
